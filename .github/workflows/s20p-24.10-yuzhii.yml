#
# 基于 P3TERX/Actions-OpenWrt 模板改造
# 目标源码: Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly (openwrt-24.10-6.6, 内核 6.6)
# 机型:     Super Gateway S20P (mediatek/filogic, supergateway_s20p)
# 配置:     configs/24.10/s20p-yuzhii-24.10.config
# DIY:      diy/24.10/diy-part{1,2}.sh
# 特性:
#   - 闭源 MTK WiFi (kmod-mt_wifi) + MTK 硬件加速 (HNAT / flow / WARP) 强校验
#   - mosdns (sbwml v5) + v2ray-geodata + OpenAppFilter(destan19)
#   - 额外 wrtbwmon (相对 25.12)
#   - argon / argon-config: 使用源码自带老版本 (已去除最新版拉取)
#   - 根目录 files/ 自动合并进固件
#   - 固件上传到本仓库 Releases
#

name: S20P-24.10-Yuzhii

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试'
        required: false
        default: 'false'
  schedule:
    # 每天北京时间 06:10 (UTC 22:10), 与 25.12 错开
    - cron: '10 22 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: configs/24.10/s20p-yuzhii-24.10.config
  DIY_P1_SH: diy/24.10/diy-part1.sh
  DIY_P2_SH: diy/24.10/diy-part2.sh
  UPLOAD_RELEASE: true
  DEVICE_NAME: s20p-yuzhii-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds / DIY part 1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # 自定义插件必须在此处(update 之后 / install 之前)执行
    - name: Custom packages / DIY part 2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 引用 files 文件夹进固件 (合并式拷贝, 不覆盖源码已有目录)
        mkdir -p openwrt/files
        if [ -d files ]; then cp -a files/. openwrt/files/ && echo "files/ 已合并进 openwrt/files"; fi
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
        # 关闭 Ruby YJIT, 避免潜在 Rust 长编译
        sed -i '/CONFIG_RUBY_ENABLE_YJIT/d' .config
        echo "# CONFIG_RUBY_ENABLE_YJIT is not set" >> .config
        make defconfig

    # 强制校验目标: mediatek/filogic + supergateway_s20p
    - name: Verify target device
      run: |
        cd openwrt
        echo "===== .config 目标相关行 ====="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES|mediatek_filogic_DEVICE)' .config || true
        DEV=$(grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_[a-z0-9_]+=y$' .config | sed -r 's/^CONFIG_TARGET_mediatek_filogic_DEVICE_(.*)=y/\1/' | head -1)
        BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        echo "board=$BOARD subtarget=$SUB device=$DEV"
        if [ "$BOARD" != "mediatek" ] || [ "$SUB" != "filogic" ] || [ "$DEV" != "supergateway_s20p" ]; then
          echo "❌ 目标机型不符: 期望 mediatek/filogic/supergateway_s20p, 实际 $BOARD/$SUB/$DEV"
          exit 1
        fi
        echo "✅ 目标机型校验通过: mediatek/filogic/supergateway_s20p"

    # 强校验: 闭源 WiFi 与 MTK 硬件加速必须真实启用, 否则立即失败(避免白编译)
    - name: Verify closed WiFi + MTK HW acceleration
      run: |
        cd openwrt
        ok=1
        check() {
          if grep -q "^$1=y\|^$1=m" .config; then echo "✅ $1";
          else echo "❌ $1 未选中 -> 请检查包名/依赖"; ok=0; fi
        }
        uncheck() {
          if grep -q "^$1=y" .config; then echo "❌ $1 仍被启用(要求关闭)"; ok=0;
          else echo "✅ $1 已关闭"; fi
        }
        echo "---- 闭源 MTK WiFi 驱动 ----"
        check CONFIG_PACKAGE_kmod-mt_wifi
        check CONFIG_PACKAGE_kmod-conninfra
        echo "---- WiFi 配置栈 (缺一不可, 否则无线无法配置) ----"
        check CONFIG_PACKAGE_mtwifi-cfg
        check CONFIG_PACKAGE_wifi-dats
        check CONFIG_PACKAGE_iwinfo
        check CONFIG_PACKAGE_datconf
        check CONFIG_PACKAGE_datconf-lua
        check CONFIG_PACKAGE_lua-cjson
        check CONFIG_PACKAGE_luci-app-mtwifi-cfg
        echo "---- MTK 硬件加速 (HNAT / flow offload / WARP) ----"
        check CONFIG_PACKAGE_kmod-mediatek_hnat
        check CONFIG_PACKAGE_kmod-warp
        check CONFIG_PACKAGE_kmod-nf-flow
        check CONFIG_PACKAGE_kmod-ipt-offload
        echo "---- 驱动级关键 kconfig (机型相关) ----"
        for s in CONFIG_MTK_MT_WIFI_MT7986_DEFAULT_FIRMWARE \
                 CONFIG_MTK_WIFI_SKU_TYPE CONFIG_MTK_WIFI_ADIE_TYPE \
                 CONFIG_MTK_RT_FIRST_IF_RF_OFFSET CONFIG_MTK_WHNAT_SUPPORT \
                 CONFIG_MTK_WARP_V2 CONFIG_WED_HW_RRO_SUPPORT CONFIG_WARP_NEW_FW; do
          grep -q "^$s=" .config && echo "✅ $s = $(grep "^$s=" .config | cut -d= -f2-)" || echo "⚠️ $s 未出现在 .config"
        done
        echo "---- 防火墙 (默认全开) ----"
        check CONFIG_PACKAGE_firewall4
        # nftables 是多变体包(nftables-json / nftables-nojson, PROVIDES=nftables),
        # 不存在 CONFIG_PACKAGE_nftables 这个符号; firewall4 依赖 +nftables-json,
        # 这里必须校验真实符号, 确认 nftables 二进制确实被编译进固件
        if grep -qE '^CONFIG_PACKAGE_nftables(-json|-nojson)=[ym]$' .config; then
          echo "✅ nftables -> $(grep -oE '^CONFIG_PACKAGE_nftables(-json|-nojson)=[ym]' .config | head -1)"
        else echo "❌ nftables(nftables-json/nojson) 未选中 -> 防火墙不会编译进固件"; ok=0; fi
        check CONFIG_PACKAGE_luci-app-firewall
        echo "---- 明确关闭项 ----"
        uncheck CONFIG_PACKAGE_kmod-dummy
        echo "---- wrtbwmon (24.10 额外) ----"
        check CONFIG_PACKAGE_luci-app-wrtbwmon
        if [ "$ok" != "1" ]; then
          echo "❌ 闭源 WiFi / MTK 硬件加速 / dummy 关闭 未全部满足, 终止编译"
          exit 1
        fi
        echo "✅ 闭源 WiFi + MTK 硬件加速 + dummy 关闭 校验通过"

    # 非致命: 列出本仓库配置里写了、但 defconfig 后被丢弃的符号, 方便发现包名写错
    - name: Report dropped config symbols
      run: |
        cd openwrt
        SRC="$GITHUB_WORKSPACE/$CONFIG_FILE"
        echo "===== 以下符号在本仓库配置中启用, 但 defconfig 后不存在(可能包名写错/源码不支持) ====="
        n=0
        while IFS= read -r sym; do
          [ -z "$sym" ] && continue
          if ! grep -q "^$sym=" .config; then echo "  ⚠️ $sym"; n=$((n+1)); fi
        done < <(grep -E '^CONFIG_[A-Za-z0-9_]+=y$' "$SRC" | sed 's/=y$//')
        echo "===== 共 $n 个符号被丢弃 (仅提示, 不中断) ====="

    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        echo "CACHE_KEY=toolchain-24.10-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}" >> $GITHUB_OUTPUT
        echo "缓存键: toolchain-24.10-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"

    - name: Restore toolchain (actions/cache)
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
          echo "actions/cache 命中, 跳过工具链编译"
          echo "save_cache=false" >> $GITHUB_OUTPUT
        else
          echo "无缓存, 开始编译工具链..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "save_cache=true" >> $GITHUB_OUTPUT
        fi
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "Makefile 已修改: 后续跳过工具链重编译"

    - name: Save toolchain (actions/cache)
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    - name: Download package
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_SUFFIX=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${DEVICE_NAME}${DEVICE_SUFFIX}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT
        {
          echo "## S20P 固件 (Yuzhii0718 24.10 / 6.6)"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 源码 | $REPO_URL |"
          echo "| 分支 | $REPO_BRANCH |"
          echo "| 设备 | supergateway_s20p / filogic |"
          echo "| 无线 | 闭源 MTK WiFi (kmod-mt_wifi) |"
          echo "| 加速 | MTK HNAT / flow / WARP |"
          echo "| 插件 | mosdns + OpenAppFilter + wrtbwmon |"
          echo "| 时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
        } > release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: '^s20p-yuzhii-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
